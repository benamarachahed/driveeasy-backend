server.port=8080
spring.application.name=api-gateway
spring.cloud.config.import=configserver:http://localhost:8888

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
management.tracing.sampling.probability=1.0

# Routes
spring.cloud.gateway.routes[0].id=vehicule-service
spring.cloud.gateway.routes[0].uri=lb://vehicule-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/vehicules/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=client-service
spring.cloud.gateway.routes[1].uri=lb://client-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clients/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=location-service
spring.cloud.gateway.routes[2].uri=lb://location-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/locations/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*